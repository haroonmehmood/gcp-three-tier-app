apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: wordpress
    tier: frontend
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-pv-claim
  labels:
    app: wordpress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      containers:
      - image: wordpress
        name: wordpress
        env:
        - name: WORDPRESS_DB_HOST
          value: wordpress-mysql
        # Both of these must be set explicitly. Current wordpress images ship a
        # wp-config-docker.php whose DB_USER default is the literal placeholder
        # "example username", so omitting this yields "Error establishing a
        # database connection". Older images defaulted to root, which is why
        # this manifest worked when it was written.
        - name: WORDPRESS_DB_USER
          value: root
        - name: WORDPRESS_DB_NAME
          value: wordpress
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: password
        ports:
        - containerPort: 80
          name: wordpress
        # GKE Ingress derives its load balancer health check from this probe,
        # and that check only treats HTTP 200 as healthy. With no probe it
        # defaults to "/", where WordPress answers 302 (redirect to the
        # installer) and the backend is marked UNHEALTHY, serving 502s.
        # blank.gif is a static asset that returns 200 whether or not WordPress
        # has been installed yet.
        readinessProbe:
          httpGet:
            path: /wp-includes/images/blank.gif
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: wordpress-persistent-storage
          mountPath: /var/www/html
      volumes:
      - name: wordpress-persistent-storage
        persistentVolumeClaim:
          claimName: wp-pv-claim
